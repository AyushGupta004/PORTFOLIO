<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' font-family='sans-serif' font-weight='bold' fill='%239B4DFF'>AG<tspan fill='%23FF4F00'>.</tspan></text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ayush Gupta | Full-Stack & Backend Developer</title>
    <meta name="description" content="Backend-first engineer building APIs, realtime systems and LLM tools that hold up under real use. Third-year B.Tech CSE (AI) student at Galgotias University." />
    <!-- Preload hero portrait -->
    <link rel="preload" as="image" href="/portrait.webp" type="image/webp" />
    <!-- Prevent theme flash before hydrate -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ayush_portfolio_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'dark' || (saved !== 'light' && prefersDark) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-bg text-ink antialiased selection:bg-accent selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
